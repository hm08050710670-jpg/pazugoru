<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>パズゴル STAGE 1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#071c16;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;display:flex;justify-content:center;overflow-x:hidden}
#app{width:min(100vw,460px);min-height:100vh;background:linear-gradient(#4da9e5 0 12%,#72b45e 34%,#08241b 34%);position:relative;overflow:hidden}
.hero{height:36vh;min-height:270px;max-height:340px;position:relative;background:linear-gradient(#55b5ec 0 35%,#85c76b 36% 100%);overflow:hidden}
.hero:before{content:"";position:absolute;left:-10%;right:-10%;bottom:-20px;height:115px;background:#5aa34d;border-radius:50% 50% 0 0}
.logo{position:absolute;left:15px;top:12px;font-size:31px;font-weight:1000;letter-spacing:-2px;text-shadow:0 3px #111;z-index:5}.sub{display:block;font-size:10px;letter-spacing:1px;color:#86e7df;text-align:center;text-shadow:none}
.stage{position:absolute;left:17px;top:82px;z-index:5;font-weight:900;text-shadow:0 2px 2px #000}.stage b{display:inline-block;background:#111;border-radius:20px;padding:4px 10px;margin-bottom:5px}.turn{display:block;margin-top:7px;background:#111;border-radius:20px;padding:6px 13px;width:max-content;font-size:20px}.turn em{color:#ff3f4c;font-style:normal}.menu{position:absolute;right:14px;top:17px;background:#102b36;border-radius:25px;padding:10px 16px;font-weight:900;z-index:5}
.dragon{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);width:185px;height:195px;z-index:3;filter:drop-shadow(0 8px 5px #0004)}
.head{position:absolute;width:145px;height:125px;left:20px;top:5px;background:#e13e49;border:5px solid #471d25;border-radius:50% 50% 46% 46%}
.horn{position:absolute;width:28px;height:43px;background:#f5eee5;border:5px solid #471d25;border-radius:70% 20%;top:-24px}.h1{left:16px;transform:rotate(-25deg)}.h2{right:16px;transform:scaleX(-1) rotate(-25deg)}
.eye{position:absolute;width:45px;height:53px;background:#fff;border:5px solid #321b20;border-radius:50%;top:33px}.e1{left:19px}.e2{right:19px}.eye:after{content:"";position:absolute;width:23px;height:32px;border-radius:50%;background:#25aee4;border:6px solid #17232c;left:6px;top:8px;box-shadow:inset 6px 3px #fff}
.pac{position:absolute;left:48px;top:87px;width:50px;height:33px;border-radius:50%;background:#f0d9f1;border:5px solid #422438}.pac:after{content:"";position:absolute;width:22px;height:22px;background:#f69a26;border:5px solid #65371c;border-radius:50%;left:9px;top:7px}
.body{position:absolute;width:105px;height:95px;background:#d93c47;border:5px solid #471d25;border-radius:48%;left:40px;top:105px}.belly{position:absolute;width:55px;height:70px;background:#efc6aa;border-radius:50%;left:20px;top:12px}
.wing{position:absolute;width:62px;height:73px;background:#d77f9c;border:5px solid #471d25;border-radius:70% 20% 60%;top:105px}.w1{left:5px;transform:rotate(-28deg)}.w2{right:5px;transform:scaleX(-1) rotate(-28deg)}
.hpwrap{padding:4px 14px 0;background:#0b291e}.bar{height:18px;background:#111;border:3px solid #d9e0dd;border-radius:15px;overflow:hidden;position:relative;margin-bottom:7px}.fill{height:100%;width:100%;transition:.35s}.enemy{background:#f22949}.player{background:#35dc69}.num{position:absolute;right:8px;top:-1px;font-weight:1000;font-size:15px;text-shadow:0 2px #000}.heart{position:absolute;left:-1px;top:-4px;font-size:24px;z-index:3}
#status{text-align:center;font-size:12px;font-weight:900;min-height:21px;background:#0b291e}
.board{margin:0 9px 10px;padding:5px;background:#173c28;border:3px solid #466b45;border-radius:16px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;touch-action:none}
.ball{aspect-ratio:1;border-radius:50%;position:relative;border:2px solid #ffffff45;box-shadow:inset -7px -9px 11px #0003,inset 5px 6px 10px #fff7,0 2px 3px #0008;transition:.08s transform,.12s opacity}
.ball:before{content:"";position:absolute;inset:4%;border-radius:50%;opacity:.24;background-image:radial-gradient(circle,#102018 0 1px,transparent 1.8px);background-size:8px 8px}
.ball:after{position:absolute;inset:0;display:grid;place-items:center;font-size:27px;font-weight:1000;text-shadow:0 2px 2px #0005}
.red{background:#e64b4b}.red:after{content:"♨";color:#791d18}.blue{background:#58aee5}.blue:after{content:"●";color:#0762bd}.green{background:#50bd72}.green:after{content:"◆";color:#08783c;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.yellow{background:#efd24e}.yellow:after{content:"ϟ";color:#9a6b00;font-size:35px}.purple{background:#9a60cf}.purple:after{content:"✺";color:#4e1b79}.pink{background:#f29aba}.pink:after{content:"♥";color:#e52e78}
.sel{transform:scale(1.18);outline:3px solid #fff;z-index:6;filter:brightness(1.12);box-shadow:0 0 0 4px #ffffff55,0 8px 16px #0007}
.fx{position:absolute;left:50%;top:41%;transform:translate(-50%,-50%);z-index:20;font-size:38px;font-weight:1000;color:white;text-shadow:0 4px #251b18,0 0 14px #fff;opacity:0;white-space:nowrap;pointer-events:none}.show{animation:pop .75s}@keyframes pop{15%{opacity:1;transform:translate(-50%,-50%) scale(1.35)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-55%) rotate(-5deg)}50%{transform:translateX(-45%) rotate(5deg)}75%{transform:translateX(-53%)}}
.shot{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;z-index:15;box-shadow:inset -3px -3px 4px #999;pointer-events:none;transition:.32s ease-in}
.over{display:none;position:absolute;inset:0;background:#061712e9;z-index:50;align-items:center;justify-content:center;text-align:center}.over.on{display:flex}.over h1{font-size:46px;margin:0 0 10px}.over button{border:0;border-radius:30px;padding:14px 28px;font-size:17px;font-weight:900;background:#f2d55e}.foot{text-align:center;padding:0 0 14px;font-weight:1000;font-size:22px}.foot small{display:block;font-size:10px;letter-spacing:2px}
</style></head>
<body><main id="app">
<section class="hero" id="hero"><div class="logo">パズゴル<span class="sub">GOLF × PUZZLE</span></div><div class="stage"><b>STAGE 1</b><br>越谷ベビードラゴン<span class="turn"><em>あと</em> <span id="turn">2</span></span></div><div class="menu">☰ Menu</div>
<div class="dragon" id="dragon"><div class="wing w1"></div><div class="wing w2"></div><div class="body"><div class="belly"></div></div><div class="head"><div class="horn h1"></div><div class="horn h2"></div><div class="eye e1"></div><div class="eye e2"></div><div class="pac"></div></div></div></section>
<section class="hpwrap"><div class="bar"><div class="fill enemy" id="eh"></div><span class="num" id="en">5,000 / 5,000</span></div><div style="display:flex;align-items:center;gap:7px;margin:1px 1px 3px;font-size:12px;font-weight:1000"><span style="background:#fff;color:#173126;border-radius:12px;padding:2px 8px">あなたのHP</span><span style="opacity:.85">ピンクで回復</span></div><div class="bar"><span class="heart">💗</span><div class="fill player" id="ph"></div><span class="num" id="pn">3,200 / 3,200</span></div></section>
<div id="status">ゴルフボールを押したまま動かそう！</div><div class="board" id="board"></div><div class="foot">パズゴル<small>GOLF GUTS</small></div><div class="fx" id="fx"></div>
<div class="over" id="over"><div><h1 id="result"></h1><p id="message"></p><button onclick="location.reload()">もう一度</button></div></div>
</main>
<script>
const COLORS=['red','blue','green','yellow','purple','pink'], board=document.getElementById('board');
let grid=[],drag=false,current=-1,busy=false,enemyHP=5000,playerHP=3200,turn=0;
const wait=n=>new Promise(r=>setTimeout(r,n)), rnd=()=>COLORS[Math.floor(Math.random()*6)];
function matches(){let s=new Set;for(let r=0;r<5;r++){let q=0;for(let c=1;c<=6;c++){if(c<6&&grid[r*6+c]===grid[r*6+q])continue;if(c-q>=3)for(let k=q;k<c;k++)s.add(r*6+k);q=c}}for(let c=0;c<6;c++){let q=0;for(let r=1;r<=5;r++){if(r<5&&grid[r*6+c]===grid[q*6+c])continue;if(r-q>=3)for(let k=q;k<r;k++)s.add(k*6+c);q=r}}return s}
function init(){do{grid=Array.from({length:30},rnd)}while(matches().size);draw()} function draw(){board.innerHTML='';grid.forEach((c,i)=>{let d=document.createElement('div');d.className='ball '+c;d.dataset.i=i;board.appendChild(d)})} init();
function at(x,y){for(let i=0;i<board.children.length;i++){let r=board.children[i].getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return i}return-1}
let activePointer=null;
board.onpointerdown=e=>{if(busy)return;let i=at(e.clientX,e.clientY);if(i<0)return;drag=true;current=i;activePointer=e.pointerId;board.setPointerCapture(e.pointerId);board.children[i].classList.add('sel');e.preventDefault()}
window.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==activePointer)return;
  const br=board.getBoundingClientRect();
  const pad=95;
  if(e.clientX<br.left-pad||e.clientX>br.right+pad||e.clientY<br.top-pad||e.clientY>br.bottom+pad)return;
  let x=Math.max(br.left+2,Math.min(br.right-2,e.clientX)),y=Math.max(br.top+2,Math.min(br.bottom-2,e.clientY));
  let n=at(x,y);if(n<0||n===current)return;
  let r=Math.floor(current/6),c=current%6,R=Math.floor(n/6),C=n%6;
  while(Math.abs(r-R)+Math.abs(c-C)>0){
    let nr=r,nc=c;if(Math.abs(C-c)>=Math.abs(R-r))nc+=Math.sign(C-c);else nr+=Math.sign(R-r);
    let next=nr*6+nc;[grid[current],grid[next]]=[grid[next],grid[current]];
    let oldEl=board.children[current],newEl=board.children[next];oldEl.className='ball '+grid[current];newEl.className='ball '+grid[next]+' sel';
    current=next;r=nr;c=nc;
  }
  if(navigator.vibrate)navigator.vibrate(6);e.preventDefault();
},{passive:false});
function release(e){if(!drag||(e.pointerId!==undefined&&activePointer!==null&&e.pointerId!==activePointer))return;drag=false;activePointer=null;try{board.releasePointerCapture(e.pointerId)}catch(_){}resolve()}
window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);
function groups(m){let seen=new Set,gs=[];for(let x of m){if(seen.has(x))continue;let st=[x],g=[];seen.add(x);while(st.length){let z=st.pop();g.push(z);let r=Math.floor(z/6),c=z%6;for(let [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){let R=r+dr,C=c+dc,n=R*6+C;if(R>=0&&R<5&&C>=0&&C<6&&m.has(n)&&!seen.has(n)&&grid[n]===grid[z]){seen.add(n);st.push(n)}}}gs.push(g)}return gs}
function hitWord(n){return n<=2?'ペチッ！':n<=4?'バシッ！':n<=6?'ドン！！':n<=9?'ドドドドッ！！！':'ULTRA SHOT!!!'}
function flash(text){fx.textContent=text;fx.classList.remove('show');void fx.offsetWidth;fx.classList.add('show')}
async function shots(n){let hero=document.getElementById('hero'),hr=hero.getBoundingClientRect(),br=board.getBoundingClientRect();for(let i=0;i<Math.min(14,n);i++){let p=document.createElement('div');p.className='shot';p.style.left=(br.width/2+(Math.random()-.5)*150)+'px';p.style.top=(br.top-hr.top-5)+'px';hero.appendChild(p);requestAnimationFrame(()=>{p.style.transform=`translate(${(Math.random()-.5)*90}px,${-120-Math.random()*80}px) scale(.5)`;p.style.opacity='.1'});setTimeout(()=>p.remove(),360);await wait(25)}}
async function resolve(){busy=true;let combo=0,attack=0,heal=0;while(1){let m=matches();if(!m.size)break;let gs=groups(m);combo+=gs.length;for(let g of gs){grid[g[0]]==='pink'?heal+=g.length:attack+=g.length}for(let i of m)grid[i]=null;draw();await wait(115);for(let c=0;c<6;c++){let vals=[];for(let r=4;r>=0;r--)if(grid[r*6+c])vals.push(grid[r*6+c]);for(let r=4,k=0;r>=0;r--,k++)grid[r*6+c]=vals[k]||rnd()}draw();await wait(165)}
if(!combo){status.textContent='揃わなかった！もう一度！';busy=false;return}
flash(combo+' COMBO!');let mult=1+(combo-1)*.38,dmg=Math.round(attack*42*mult),rec=Math.round(heal*38*(1+(combo-1)*.2));playerHP=Math.min(3200,playerHP+rec);await wait(260);await shots(Math.max(attack,combo*2));flash(hitWord(combo));dragon.classList.add('shake');await wait(350);dragon.classList.remove('shake');enemyHP=Math.max(0,enemyHP-dmg);update();status.textContent=`${combo} COMBO！ ${dmg}ダメージ${rec?' ＋ '+rec+'回復':''}`;if(!enemyHP){end(true);return}
turn++;if(turn%2===0){await wait(500);flash('バブー！');await wait(450);playerHP=Math.max(0,playerHP-520);update();status.textContent='越谷ベビードラゴンの反撃！ 520ダメージ';if(!playerHP){end(false);return}}busy=false}
function update(){eh.style.width=enemyHP/50+'%';ph.style.width=playerHP/32+'%';en.textContent=enemyHP.toLocaleString()+' / 5,000';pn.textContent=playerHP.toLocaleString()+' / 3,200';document.getElementById('turn').textContent=2-turn%2}
function end(win){over.classList.add('on');result.textContent=win?'CLEAR!':'GAME OVER';message.textContent=win?'越谷ベビードラゴンを倒した！':'ベビードラゴンがおしゃぶりをくわえて得意げにしている…'}
</script></body></html>
